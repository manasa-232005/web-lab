<!DOCTYPE html>
<html>
<head>
  <title>Text Animation</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      padding-top: 100px;
    }
  </style>
</head>
<body>
  <h1 id="animatedText"></h1>

  <script>
    var textElement = document.getElementById("animatedText");
    var fontSize = 5;
    var isGrowing = true;

    textElement.innerText = "TEXT-GROWING";
    textElement.style.color = "red";
    textElement.style.fontSize = fontSize + "pt";

    // Run the animation continuously
    setInterval(changeSize, 100);

    function changeSize() {
      if (isGrowing) {
        // Increase the font size
        fontSize++;

        // Switch to shrinking when font size reaches 50
        if (fontSize >= 50) {
          isGrowing = false;
          textElement.innerText = "TEXT-SHRINKING";
          textElement.style.color = "blue";
        }
      } else {
        // Decrease the font size
        fontSize--;

        // Restart growing when font size reaches 5
        if (fontSize <= 5) {
          fontSize = 5;
          isGrowing = true;
          textElement.innerText = "TEXT-GROWING";
          textElement.style.color = "red";
        }
      }

      textElement.style.fontSize = fontSize + "pt";
    }
  </script>
</body>
</html>
